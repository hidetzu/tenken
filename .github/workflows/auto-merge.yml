# Auto-merge: run merge-gate (.claude/tools/merge-gate.mjs) when a PR may have become mergeable, and merge on its PASS.
# ⚠ merge-gate is the only judge, exactly as when the AI runs it by hand (.claude/rules/git.md § Permission, way 1).
#   It runs WITHOUT --owner-grant: a PR that changes an owner-only path is refused here and merged by hand (way 2).
# ⚠ It runs merge-gate from main, never from the PR: the checkout is the default branch on both triggers, and no
#   code from the PR is run. The PR is only read through the API.
# ⚠ The token is the owner's GitHub App (variable AUTO_MERGE_APP_CLIENT_ID, secret AUTO_MERGE_APP_PRIVATE_KEY), not
#   GITHUB_TOKEN: a merge by GITHUB_TOKEN would not start ci, os and CodeQL on main. Without the variable, it says so
#   and does nothing.
# ⚠ Triggers: a review comment by the owner (the review is posted through the owner's account; merge-gate checks the
#   login and the id again), or ci finishing on a PR branch (a review posted before CI finished).
name: auto-merge

on:
  issue_comment:
    types: [created]
  workflow_run:
    workflows: [ci]
    types: [completed]

permissions: {}

jobs:
  merge:
    runs-on: ubuntu-latest
    if: >-
      (github.event_name == 'issue_comment' && github.event.issue.pull_request &&
       github.event.comment.user.id == 2199131 && startsWith(github.event.comment.body, 'Verdict: PASS')) ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'pull_request' &&
       github.event.workflow_run.conclusion == 'success')
    # ⚠ At job level rather than workflow level, so that a run whose `if` is false has no reason to enter the
    #   group. ⚠ GitHub's docs do not say whether a job skipped by `if` enters it; if it does, a comment by anyone
    #   could replace a pending run here (a newer pending run replaces an older one). That only stops a merge:
    #   the PR is then merged by hand.
    concurrency:
      # ⚠ The PR number on both triggers (never a branch name, which whoever pushes chooses)
      group: auto-merge-${{ github.event.issue.number || github.event.workflow_run.pull_requests[0].number || github.run_id }}
      cancel-in-progress: false
    env:
      HAS_APP: ${{ vars.AUTO_MERGE_APP_CLIENT_ID != '' }}
    steps:
      - name: say the app is not configured
        if: env.HAS_APP != 'true'
        run: |
          echo "AUTO_MERGE_APP_CLIENT_ID is not set: nothing was merged. Run merge-gate by hand."
      - name: find the PR
        if: env.HAS_APP == 'true'
        id: pr
        env:
          FROM_COMMENT: ${{ github.event.issue.number }}
          FROM_RUN: ${{ github.event.workflow_run.pull_requests[0].number }}
        run: |
          set -euo pipefail
          # ⚠ workflow_run lists no PR for a fork's branch: then there is nothing to do here.
          n="${FROM_COMMENT:-${FROM_RUN:-}}"
          case "$n" in ''|*[!0-9]*) echo "no PR number on this event: nothing to do"; echo "n=" >> "$GITHUB_OUTPUT" ;; *) echo "n=$n" >> "$GITHUB_OUTPUT" ;; esac
      - uses: actions/checkout@v7
        if: steps.pr.outputs.n != ''
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v7
        if: steps.pr.outputs.n != ''
        with:
          node-version: "22"
      - name: mint a token
        if: steps.pr.outputs.n != ''
        id: app
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.AUTO_MERGE_APP_CLIENT_ID }}
          private-key: ${{ secrets.AUTO_MERGE_APP_PRIVATE_KEY }}
          # ⚠ Only what merge-gate calls: read the PR, its files, comments, checks and the compare (read);
          #   merge and delete the branch (contents write); post the record on the PR (pull-requests write);
          #   statusCheckRollup's workflow name, which merge-gate matches the required checks by (actions read)
          permission-contents: write
          permission-actions: read
          permission-pull-requests: write
          permission-checks: read
          permission-statuses: read
      - name: run merge-gate
        if: steps.pr.outputs.n != ''
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ steps.pr.outputs.n }}
        run: |
          set -euo pipefail
          # ⚠ 0 merged, 1 refused (the normal answer while a condition is not met yet), 2 / 3 something went wrong.
          #   The default shell is bash -e, so the exit code is caught with || (a bare call would end the step on 1).
          # ⚠ merge-gate prints PR file names; stop-commands keeps any of them from being read as a workflow command.
          stop="$(openssl rand -hex 16)"
          echo "::stop-commands::${stop}"
          code=0
          MERGE_GATE_ACTOR=workflow node .claude/tools/merge-gate.mjs "$PR" || code=$?
          echo "::${stop}::"
          [ "$code" -le 1 ] || exit "$code"
